    <script>
      // Apply the saved theme before the first paint; storage may be unavailable.
      try {
        const theme = localStorage.getItem('theme');
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#151614' : '#ffffff';
      } catch { document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches); }
    </script>
